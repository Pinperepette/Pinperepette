name: README build

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"    # ogni giorno alle 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rigenera gli SVG
        env:
          # opzionale: PAT con scope read:user -> abilita la riga "Commits"
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
        run: python3 generate.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git commit -m "Aggiorna le statistiche del profilo" || echo "Nessuna modifica"
          git push
